<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>دين</title>
<meta name="apple-mobile-web-app-title" content="دين">
<meta name="theme-color" content="#1B2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="storage.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1b2430;--mut:#8a919c;--line:#eeece8;--hero:#1b2430;--heroink:#fff;--debt:#d8455a;--pay:#17a083;--acc:#3b5bdb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11141a;--card:#1a1e26;--ink:#eef0f4;--mut:#8b93a1;--line:#272c36;--hero:#242a36;--heroink:#fff;--debt:#ff7088;--pay:#3fd1a8;--acc:#8aa0ff}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh;line-height:1.5}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

.top{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.top input{flex:1;min-width:0;font:inherit;font-size:22px;font-weight:800;background:transparent;border:0;color:var(--ink);padding:4px 0}
.top input::placeholder{color:var(--mut);font-weight:500}
.top input:focus{outline:none}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--mut);display:grid;place-items:center}

.hero{background:var(--hero);color:var(--heroink);border-radius:28px;padding:26px 22px 22px}
.hero .lb{opacity:.65;font-size:14px}
.hero .big{font-size:56px;font-weight:800;line-height:1.1;margin:2px 0 18px;letter-spacing:-.5px}
.hero .sub{display:flex;gap:28px;font-size:13px;opacity:.9}
.hero .sub b{display:block;font-size:18px;margin-top:2px}
.hero .sub span{opacity:.65}

.acts{display:flex;gap:10px;margin:14px 0 28px}
.acts button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:15px;font-size:17px;font-weight:700;color:#fff}
.a-debt{background:var(--debt)}.a-pay{background:var(--pay)}

.mon{background:var(--card);border-radius:24px;padding:6px 18px 8px;margin-bottom:14px}
.mh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0 12px}
.mh b{font-size:17px}
.mh span{font-size:14px;color:var(--mut)}
.mh span strong{color:var(--ink);font-size:17px;margin-inline-start:4px}
.st{display:flex;padding:0 0 14px;border-bottom:1px solid var(--line)}
.st div{flex:1;font-size:12.5px;color:var(--mut)}
.st b{display:block;font-size:15px;color:var(--ink);font-weight:700}
.rw{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.rw:last-child{border-bottom:0}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.dot svg{width:17px;height:17px}
.rw.debt .dot{background:color-mix(in srgb,var(--debt) 14%,transparent);color:var(--debt)}
.rw.pay .dot{background:color-mix(in srgb,var(--pay) 14%,transparent);color:var(--pay)}
.rw .m{flex:1;min-width:0}
.rw .n{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.rw .d{font-size:12.5px;color:var(--mut)}
.rw .a{font-weight:800;font-size:16px;direction:ltr}
.rw.debt .a{color:var(--debt)}.rw.pay .a{color:var(--pay)}
.rw .x{border:0;background:transparent;color:var(--mut);width:30px;height:30px;display:grid;place-items:center;border-radius:50%}
.rw .x svg{width:15px;height:15px}
.empty{color:var(--mut);text-align:center;padding:32px 0}

dialog{border:0;border-radius:28px 28px 0 0;padding:10px 22px 26px;width:100%;max-width:460px;margin:auto auto 0;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,12,20,.5)}
.grip{width:40px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 16px}
dialog h3{margin:0 0 4px;font-size:19px}
dialog label{display:block;margin:14px 4px 6px;font-size:13px;color:var(--mut)}
dialog input{width:100%;font:inherit;font-size:18px;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.dbtn{display:flex;gap:10px;margin-top:22px}
.dbtn button{flex:1;border:0;border-radius:999px;padding:14px;font-size:16px;font-weight:700}
.ok{background:var(--acc);color:#fff}.no{background:var(--bg);color:var(--ink)}
.rw{cursor:pointer}
.rw:active{opacity:.6}
.rw .ed{color:var(--mut)}.rw .ed svg{width:16px;height:16px}
.sec{font-size:13px;color:var(--mut);margin:22px 6px 8px}
.old{display:flex;justify-content:space-between;align-items:center;padding:13px 0;color:var(--mut);font-size:14px}
.old b{color:var(--ink);font-size:16px}
#arc{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:50;padding-top:env(safe-area-inset-top,0px);display:none}#arc.show{display:block}
.hint{text-align:center;color:var(--mut);font-size:12.5px;margin:-14px 0 16px}
.seg{display:flex;background:var(--bg);border-radius:999px;padding:4px;margin:10px 0 2px}
.seg button{flex:1;border:0;background:transparent;color:var(--mut);border-radius:999px;padding:10px;font-size:15px;font-weight:700}
.seg button.on.debt{background:var(--debt);color:#fff}.seg button.on.pay{background:var(--pay);color:#fff}
.del{display:none;width:100%;margin-top:10px;border:0;background:transparent;color:var(--debt);font-size:15px;font-weight:700;padding:10px}
.del.show{display:block}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:428px;margin:0 auto;background:var(--hero);color:#fff;border-radius:999px;padding:8px 8px 8px 20px;display:none;align-items:center;justify-content:space-between;z-index:50}
.toast.show{display:flex}
.toast button{border:0;border-radius:999px;background:rgba(255,255,255,.18);color:#fff;font-weight:700;padding:8px 18px}
*{-webkit-tap-highlight-color:transparent}
button,input,.rw,dialog{outline:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
html{scroll-behavior:smooth}
button{transition:transform .15s ease,opacity .15s ease,background-color .2s ease}
button:active{transform:scale(.96)}
.rw{transition:background-color .2s ease,opacity .15s ease}
dialog[open]{animation:up .32s cubic-bezier(.22,1,.36,1)}
dialog[open]::backdrop{animation:fade .3s ease}
dialog.out{animation:down .24s cubic-bezier(.4,0,1,1) forwards}
dialog.out::backdrop{animation:fade .24s ease reverse forwards}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes down{to{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.grip{padding:0;height:4px;background-clip:content-box;border-top:12px solid transparent;border-bottom:12px solid transparent;box-sizing:content-box;touch-action:none;margin-top:-8px;margin-bottom:6px}
.toast{display:flex;transform:translateY(160%);opacity:0;visibility:hidden;transition:transform .35s cubic-bezier(.22,1,.36,1),opacity .25s ease,visibility .35s}
.toast.show{transform:none;opacity:1;visibility:visible}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
body{overflow-x:hidden;--p:0}
#pm,#arc,#nv{touch-action:pan-y}
#pm,#arc{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));transition:transform .42s cubic-bezier(.22,1,.36,1)}
#pm{transform:translateX(calc(var(--p)*100%))}
#arc{display:block;transform:translateX(calc((var(--p) - 1)*100%))}
body.dg #pm,body.dg #arc,body.dg #nv i{transition:none}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#nv{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:60;width:min(320px,calc(100% - 32px));display:flex;padding:5px;border-radius:999px;background:color-mix(in srgb,var(--card) 52%,transparent);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);box-shadow:0 12px 32px rgba(0,0,0,.16),inset 0 1px 0 rgba(255,255,255,.45)}
#nv i{position:absolute;top:5px;bottom:5px;inset-inline-start:5px;width:calc(50% - 5px);border-radius:999px;background:color-mix(in srgb,var(--acc) 18%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 22%,transparent);transform:translateX(calc(var(--p)*-100%));transition:transform .42s cubic-bezier(.22,1,.36,1)}
#nv button{position:relative;z-index:1;flex:1;border:0;background:transparent;color:var(--mut);font:inherit;font-size:12px;font-weight:700;display:grid;justify-items:center;gap:1px;padding:7px 0;border-radius:999px;transition:color .25s}
#nv button.on{color:var(--acc)}
#nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hero{position:relative;overflow:hidden;border-radius:32px;padding:28px 24px 30px;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 50%,var(--hero)) 0%,var(--hero) 64%);box-shadow:0 18px 40px -16px color-mix(in srgb,var(--acc) 55%,transparent),inset 0 1px 0 rgba(255,255,255,.14)}
.hero::before{content:"";position:absolute;width:220px;height:220px;border-radius:50%;top:-90px;inset-inline-end:-60px;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}
.hero::after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;bottom:-70px;inset-inline-start:-40px;border:1px solid rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}
.hero .lb{display:inline-block;background:rgba(255,255,255,.14);padding:4px 14px;border-radius:999px;font-size:13px;opacity:1;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hero .big{font-size:60px;margin:14px 0 0}
.acts button{padding:16px;font-size:17px;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.a-debt{background:linear-gradient(135deg,color-mix(in srgb,var(--debt) 80%,#fff),var(--debt));box-shadow:0 10px 22px -8px color-mix(in srgb,var(--debt) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.28)!important}
.a-pay{background:linear-gradient(135deg,color-mix(in srgb,var(--pay) 80%,#fff),var(--pay));box-shadow:0 10px 22px -8px color-mix(in srgb,var(--pay) 60%,transparent),inset 0 1px 0 rgba(255,255,255,.28)!important}
.mon{border-radius:30px;padding:8px 16px 10px;border:1px solid color-mix(in srgb,var(--ink) 6%,transparent);box-shadow:0 14px 34px -18px rgba(20,30,60,.28)}
.mh{padding:12px 2px 12px}
.mh b{font-size:17px;font-weight:800}
.mh span{display:flex;align-items:baseline;gap:6px;background:var(--bg);padding:5px 14px;border-radius:999px;font-size:12.5px}
.mh span strong{margin:0;font-size:16px}
.st{gap:8px;border-bottom:0;padding:0 0 10px}
.st div{background:var(--bg);border-radius:18px;padding:10px 12px}
.st div:nth-child(2) b{color:var(--debt)}.st div:nth-child(3) b{color:var(--pay)}
.rw{border-bottom:0;padding:10px 8px;margin:0 -8px;border-radius:20px;gap:12px}
.rw:active{background:var(--bg);opacity:1}
.dot{width:42px;height:42px;border-radius:15px}
.rw .a{font-size:16px}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.95);filter:blur(8px)}to{opacity:1;transform:none;filter:blur(0)}}
@keyframes slin{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateX(-50%) translateY(46px) scale(.82)}to{opacity:1;transform:translateX(-50%)}}
@keyframes bnc{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
:root{--ez:cubic-bezier(.22,1,.36,1);--sp:cubic-bezier(.34,1.45,.64,1)}
.fx .hero,.fx .acts button,.fx .mon{animation:rise .8s var(--ez) backwards}
.fx .hero{animation-delay:.04s}
.fx .acts button:nth-child(1){animation-delay:.16s}.fx .acts button:nth-child(2){animation-delay:.24s}
.fx .mon:nth-child(1){animation-delay:.3s}.fx .mon:nth-child(2){animation-delay:.4s}.fx .mon:nth-child(3){animation-delay:.5s}.fx .mon:nth-child(n+4){animation-delay:.6s}
.fx .rw{animation:slin .55s var(--ez) backwards}
.fx .rw:nth-child(3){animation-delay:.46s}.fx .rw:nth-child(4){animation-delay:.52s}.fx .rw:nth-child(5){animation-delay:.58s}.fx .rw:nth-child(6){animation-delay:.64s}.fx .rw:nth-child(n+7){animation-delay:.7s}
#nv{animation:pop .8s var(--sp) .35s backwards}
#nv i{transition:transform .55s var(--sp)}
#nv button.on svg{animation:bnc .5s var(--sp)}
.toast{transition:transform .5s var(--sp),opacity .25s ease,visibility .5s}
dialog[open]{animation:up .5s var(--ez)}
.rw,.mon{transition:background-color .25s ease,transform .25s var(--ez)}
.rw:active{transform:scale(.98)}
@media (prefers-reduced-motion:reduce){*{animation-delay:0s!important}}
</style>
</head>
<body>
<div class="wrap" id="pm">
  <div class="top">
    <input id="who" placeholder="اسم الشخص" aria-label="اسم الشخص">
    <button class="ib" id="snd" aria-label="الصوت" onclick="toggleSnd()"></button>
    <button class="ib" aria-label="مشاركة الكشف" onclick="share()"><svg viewBox="0 0 24 24"><path d="M4 12v7h16v-7M12 3v12M8 7l4-4 4 4"/></svg></button>
    <button class="ib" aria-label="مسح الكل" onclick="resetAll()"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div>

  <div class="hero">
    <div class="lb">المتبقي</div>
    <div class="big" id="left">0</div>
  </div>

  <div class="acts">
    <button class="a-debt" onclick="openD('debt')"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>دين</button>
    <button class="a-pay" onclick="openD('pay')"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>دفعة</button>
  </div>

  <div class="hint">اضغط على أي عملية لتعديلها أو حذفها</div>
  <div id="list"></div>
</div>

<div id="arc"><div class="wrap"><div class="top"><b style="flex:1;font-size:18px">الأشهر السابقة</b></div><div id="arcl"></div></div></div>
<nav id="nv"><i></i><button id="n0" class="on" onclick="arc(0)"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8M5 10v10h14V10"/></svg>الرئيسية</button><button id="n1" onclick="arc(1)"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2M21 12a9 9 0 11-3-6.7M21 4v5h-5"/></svg>الأشهر السابقة</button></nav>
<dialog id="dlg">
  <div class="grip"></div>
  <h3 id="dt"></h3>
  <div class="seg"><button id="sd" class="debt" onclick="setKind('debt')">دين</button><button id="sp" class="pay" onclick="setKind('pay')">دفعة</button></div>
  <label>المبلغ</label><input id="amt" type="number" inputmode="decimal" min="0" step="any">
  <label>التاريخ</label><input id="dat" type="date">
  <label>ملاحظة (اختياري)</label><input id="note" type="text">
  <div class="dbtn"><button class="ok" onclick="save()">حفظ</button><button class="no" onclick="closeD()">إلغاء</button></div>
  <button class="del" id="delb" onclick="delCur()">حذف هذه العملية</button>
</dialog>
<div class="toast" id="toast"><span>تم الحذف</span><button onclick="undo()">تراجع</button></div>

<script>
const KEY="debt_book_v1";
let S={name:"",tx:[]};
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
const $=id=>document.getElementById(id);
const dlg=$("dlg");let kind="debt";
const fmt=n=>Number(n).toLocaleString("en-US",{maximumFractionDigits:2});
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PEN='<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg>';
const UP='<svg viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',DN='<svg viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',X='<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const SON='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM16.5 8.5a5 5 0 010 7"/></svg>',SOFF='<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zM17 9l5 6M22 9l-5 6"/></svg>';
const ORD=["الأول","الثاني","الثالث","الرابع","الخامس","السادس","السابع","الثامن","التاسع","العاشر","الحادي عشر","الثاني عشر"];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const sum=(a,k)=>a.filter(t=>t.k===k).reduce((x,t)=>x+t.a,0);

function render(){
  $("who").value=S.name||"";
  $("snd").innerHTML=S.mute?SOFF:SON;
  let cy=[],bl=0;
  for(const t of [...S.tx].sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id)){cy.push(t);bl+=t.k==="debt"?t.a:-t.a;if(bl<=0.005&&cy.some(x=>x.k==="debt")){cy=[]}}
    tween($("left"),bl);
  const L=$("list");
  if(!S.tx.length){L.innerHTML='<div class="empty">لا توجد عمليات بعد</div>';$("arcl").innerHTML="";return}
  const mk=t=>t.d.slice(0,7);
  const bal=key=>S.tx.filter(t=>mk(t)<key).reduce((x,t)=>x+(t.k==="debt"?t.a:-t.a),0);
  const now=new Date(),pad=n=>String(n).padStart(2,"0");
  const cur=now.getFullYear()+"-"+pad(now.getMonth()+1);
  const pv=new Date(now.getFullYear(),now.getMonth()-1,1),prev=pv.getFullYear()+"-"+pad(pv.getMonth()+1);
  const nm=key=>{const [y,m]=key.split("-");return "الشهر "+ORD[+m-1]+" · "+y};
  const row=t=>`<div class="rw ${t.k}" onclick="openE(${t.id})"><span class="dot">${t.k==="debt"?UP:DN}</span><div class="m"><div class="n">${t.n?esc(t.n):(t.k==="debt"?"دين":"دفعة")}</div><div class="d">${t.d}</div></div><div class="a" data-v="${t.a}" data-p="${t.k==="debt"?"+":"−"}">${t.k==="debt"?"+":"−"}${fmt(t.a)}</div><span class="ed">${PEN}</span></div>`;
  const card=(key,title,extra)=>{const arr=S.tx.filter(t=>mk(t)===key).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id),open=bal(key),d=sum(arr,"debt"),p=sum(arr,"pay");
    return `<div class="mon"><div class="mh"><b>${title}</b><span>المتبقي<strong data-v="${open+d-p}">${fmt(open+d-p)}</strong></span></div><div class="st"><div>سابق<b data-v="${open}">${fmt(open)}</b></div><div>ديون<b data-v="${d}">${fmt(d)}</b></div><div>مدفوع<b data-v="${p}">${fmt(p)}</b></div></div>${arr.map(row).join("")||'<div class="old">لا توجد عمليات</div>'}${extra||""}</div>`};
  const later=[...new Set(S.tx.map(mk))].filter(k=>k>cur).sort().reverse();
  let h=later.map(k=>card(k,nm(k))).join("")+card(cur,"هذا الشهر · "+nm(cur).replace("الشهر ","").split(" · ")[0]);
  const pk=[...new Set(S.tx.map(mk))].filter(k=>k<cur).sort().reverse();
  $("arcl").innerHTML=pk.map(k=>card(k,nm(k))).join("")||'<div class="empty">لا توجد أشهر سابقة</div>';
  L.innerHTML=h;
}

let AC;
function ctx(){AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();return AC}
function beep(f,at,dur,vol){const c=ctx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+at;o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.05)}
function bell(f,at,v){const c=ctx(),t=c.currentTime+at,g=c.createGain(),lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2200;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+1.9);
  [f,f*2.005].forEach((fr,i)=>{const o=c.createOscillator(),og=c.createGain();o.type="sine";o.frequency.value=fr;og.gain.value=i?.12:1;o.connect(og);og.connect(g);o.start(t);o.stop(t+2)});g.connect(lp);lp.connect(c.destination)}
function click(){if(S.mute)return;try{bell(660,0,.02)}catch(e){}}
function chime(){if(S.mute)return;try{bell(587.33,0,.055);bell(739.99,.14,.045);bell(880,.28,.04)}catch(e){}}
function toggleSnd(){S.mute=!S.mute;persist();render()}
document.addEventListener("click",e=>{if(e.target.closest("button"))click()},true);

function closeD(){if(!dlg.open)return;dlg.classList.add("out");setTimeout(()=>{dlg.close();dlg.classList.remove("out");dlg.style.transform="";dlg.style.transition=""},240)}
function tween(el,to){el._v=to;el.textContent=fmt(to)}
dlg.addEventListener("click",e=>{if(e.target===dlg)closeD()});
dlg.addEventListener("cancel",e=>{e.preventDefault();closeD()});
(()=>{let y0=null,dy=0;const g=dlg.querySelector(".grip");
 g.addEventListener("touchstart",e=>{y0=e.touches[0].clientY;dy=0;dlg.style.transition="none"},{passive:true});
 g.addEventListener("touchmove",e=>{if(y0==null)return;dy=Math.max(0,e.touches[0].clientY-y0);dlg.style.transform="translateY("+dy+"px)"},{passive:true});
 g.addEventListener("touchend",()=>{if(y0==null)return;y0=null;dlg.style.transition="transform .25s cubic-bezier(.22,1,.36,1)";if(dy>90){closeD()}else{dlg.style.transform=""}})})();
let editId=null,lastDel=null,tm;
function setKind(k){kind=k;$("sd").classList.toggle("on",k==="debt");$("sp").classList.toggle("on",k==="pay");$("dt").textContent=editId?"تعديل العملية":"إضافة جديدة"}
function openD(k){editId=null;$("amt").value="";$("note").value="";$("dat").value=new Date().toISOString().slice(0,10);$("delb").classList.remove("show");setKind(k);dlg.showModal();setTimeout(()=>$("amt").focus(),50)}
function openE(id){const t=S.tx.find(x=>x.id===id);if(!t)return;editId=id;$("amt").value=t.a;$("note").value=t.n||"";$("dat").value=t.d;$("delb").classList.add("show");setKind(t.k);dlg.showModal()}
function save(){const a=parseFloat($("amt").value);if(!(a>0)){$("amt").focus();return}
  const d=$("dat").value||new Date().toISOString().slice(0,10),n=$("note").value.trim();
  if(editId){const t=S.tx.find(x=>x.id===editId);Object.assign(t,{k:kind,a,d,n})}
  else S.tx.push({id:Date.now(),k:kind,a,d,n});
  persist();closeD();render();setTimeout(chime,120)}
function delCur(){const t=S.tx.find(x=>x.id===editId);if(!t)return;lastDel=t;S.tx=S.tx.filter(x=>x.id!==editId);persist();closeD();render();
  $("toast").classList.add("show");clearTimeout(tm);tm=setTimeout(()=>$("toast").classList.remove("show"),6000)}
function undo(){if(lastDel){S.tx.push(lastDel);lastDel=null;persist();render()}$("toast").classList.remove("show")}
function resetAll(){if(confirm("مسح كل البيانات؟ لا يمكن التراجع.")){S.tx=[];persist();render()}}
$("who").addEventListener("input",e=>{S.name=e.target.value;persist()});
function share(){
  const asc=[...S.tx].sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);
  const lines=asc.map(t=>`${t.d} | ${t.k==="debt"?"دين":"دفعة"} ${fmt(t.a)}${t.n?" ("+t.n+")":""}`);
  const td=sum(S.tx,"debt"),tp=sum(S.tx,"pay");
  const txt=`كشف حساب${S.name?" - "+S.name:""}\n${lines.join("\n")}\n\nالإجمالي: ${fmt(td)}\nالمدفوع: ${fmt(tp)}\nالمتبقي: ${fmt(td-tp)}`;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{})}else{window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank")}
}
let cp=0,sx=null,sy=0,st=0,lk=null;
let fxT;
function cnt(root){root.querySelectorAll("[data-v]").forEach(el=>{const to=+el.dataset.v,pf=el.dataset.p||"";el.textContent=pf+fmt(to)})}
function arc(v){const ch=cp!==(v?1:0);cp=v?1:0;if(ch){const e=$(cp?"arc":"pm");e.classList.remove("fx");void e.offsetWidth;e.classList.add("fx");clearTimeout(fxT);fxT=setTimeout(()=>e.classList.remove("fx"),1600);if(!cp){const L=$("left"),v=L._v;L._v=null;tween(L,v)}cnt(e)}document.body.classList.remove("dg");document.body.style.setProperty("--p",cp);$("n0").classList.toggle("on",!cp);$("n1").classList.toggle("on",!!cp)}
addEventListener("touchstart",e=>{if(dlg.open)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();lk=null},{passive:true});
addEventListener("touchmove",e=>{if(sx==null)return;const dx=e.touches[0].clientX-sx,dy=e.touches[0].clientY-sy;
  if(lk===null&&(Math.abs(dx)>8||Math.abs(dy)>8))lk=Math.abs(dx)>Math.abs(dy)*1.2;
  if(lk){document.body.classList.add("dg");document.body.style.setProperty("--p",Math.min(1,Math.max(0,cp+dx/innerWidth)))}},{passive:true});
function endSw(e){if(sx==null)return;const t=e.changedTouches[0],dx=t.clientX-sx,fast=Date.now()-st<300&&Math.abs(dx)>40;const was=lk;sx=null;lk=null;
  if(!was)return;const p=Math.min(1,Math.max(0,cp+dx/innerWidth));arc(fast?dx>0:p>.5)}
addEventListener("touchend",endSw,{passive:true});addEventListener("touchcancel",endSw,{passive:true});
render();cnt($("pm"));
$("pm").classList.add("fx");setTimeout(()=>$("pm").classList.remove("fx"),1600);
</script>
